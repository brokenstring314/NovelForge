name: Build macOS App

# 手动触发：仓库页面 Actions → Build macOS App → Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    name: NovelForge (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14        # Apple Silicon（M 系列芯片）
            arch: arm64
          - runner: macos-15-intel  # Intel 芯片
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build backend with PyInstaller
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller NovelForgeBackend.spec --noconfirm --clean
          # Apple Silicon 上可执行文件必须带有效签名，这里补一个 ad-hoc 签名
          codesign --force --sign - "dist/NovelForgeBackend/NovelForgeBackend" || true

      - name: Smoke test backend
        working-directory: backend
        run: |
          ./dist/NovelForgeBackend/NovelForgeBackend > "$RUNNER_TEMP/backend-smoke.log" 2>&1 &
          BACKEND_PID=$!
          READY=0
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:54321/ > /dev/null 2>&1; then READY=1; break; fi
            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            echo "::error::后端冒烟测试失败：PyInstaller 可能漏收了依赖"
            tail -n 120 "$RUNNER_TEMP/backend-smoke.log"
            exit 1
          fi
          echo "后端启动正常"
          kill "$BACKEND_PID" 2>/dev/null || true

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate macOS icon (.icns)
        working-directory: frontend
        run: |
          mkdir -p build
          rm -rf icon.iconset
          mkdir -p icon.iconset
          sips -z 16 16     resources/icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     resources/icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     resources/icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     resources/icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   resources/icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   resources/icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   resources/icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   resources/icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   resources/icon.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 resources/icon.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o build/icon.icns
          rm -rf icon.iconset

      - name: Build renderer and main process
        working-directory: frontend
        run: npx electron-vite build

      - name: Package app bundle
        working-directory: frontend
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --${{ matrix.arch }} --dir

      - name: Ad-hoc sign, zip and dmg
        working-directory: frontend
        run: |
          APP_PATH="$(find dist -maxdepth 3 -type d -name 'NovelForge.app' | head -n 1)"
          echo "App bundle: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "::error::NovelForge.app not found"
            exit 1
          fi
          codesign --force --deep --sign - "$APP_PATH" || true
          codesign --verify --verbose=2 "$APP_PATH" || true
          VERSION="$(node -p "require('./package.json').version")"
          ditto -c -k --keepParent "$APP_PATH" "dist/NovelForge-${VERSION}-mac-${{ matrix.arch }}.zip"
          hdiutil create -volname "NovelForge" -srcfolder "$APP_PATH" -ov -format UDZO "dist/NovelForge-${VERSION}-mac-${{ matrix.arch }}.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovelForge-mac-${{ matrix.arch }}
          path: |
            frontend/dist/NovelForge-*-mac-${{ matrix.arch }}.zip
            frontend/dist/NovelForge-*-mac-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 30
